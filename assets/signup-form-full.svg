<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1255" viewBox="0 0 1920 1255">
  <rect width="1920" height="1255" fill="#d5d5d5"/>
  <rect x="745" y="0" width="430" height="1255" rx="3" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="765" y="68" font-size="33" font-weight="500">Let’s Talk About Your</text>
    <text x="765" y="112" font-size="33" font-weight="500">Online Presence</text>

    <text x="765" y="176" font-size="15">Share a few details about your content, platforms, and</text>
    <text x="765" y="199" font-size="15">what you’d like to improve.</text>
    <text x="765" y="230" font-size="15">I’ll use your answers to better understand your current</text>
    <text x="765" y="253" font-size="15">approach and goals.</text>

    <g font-size="14" font-weight="700">
      <text x="765" y="334">Email</text>
      <text x="765" y="412">First name</text>
      <text x="765" y="490">Last name</text>
      <text x="765" y="568">Website or Page Link</text>
      <text x="765" y="646">Which platforms are you currently using?</text>
      <text x="765" y="748">What would you like help with?</text>
      <text x="765" y="826">What would you like to improve?</text>
      <text x="765" y="904">How often are you currently posting?</text>
      <text x="765" y="982">What takes the most time right now?</text>
    </g>

    <g fill="#fff" stroke="#b9b9b9" stroke-width="1">
      <rect x="765" y="346" width="390" height="44" rx="3"/>
      <rect x="765" y="424" width="390" height="44" rx="3"/>
      <rect x="765" y="502" width="390" height="44" rx="3"/>
      <rect x="765" y="580" width="390" height="44" rx="3"/>
      <rect x="765" y="658" width="390" height="66" rx="3"/>
      <rect x="765" y="760" width="390" height="44" rx="3"/>
      <rect x="765" y="838" width="390" height="44" rx="3"/>
      <rect x="765" y="916" width="390" height="44" rx="3"/>
      <rect x="765" y="994" width="390" height="66" rx="3"/>
    </g>

    <text x="780" y="944" font-size="15" fill="#444">-</text>
    <path d="M1138 937 l6 0 l-3 5 z" fill="#222"/>

    <text x="765" y="1100" font-size="12">You can unsubscribe anytime. For more details, review our</text>
    <text x="765" y="1120" font-size="12">Privacy Policy.</text>

    <rect x="765" y="1144" width="15" height="15" rx="2" fill="#fff" stroke="#aaa"/>
    <text x="791" y="1157" font-size="11">I agree to be contacted about my inquiry and understand</text>
    <text x="791" y="1174" font-size="11">that the information I provide will be used to review my</text>
    <text x="791" y="1191" font-size="11">needs and respond to my request.</text>

    <rect x="765" y="1212" width="390" height="36" rx="2" fill="#000"/>
    <text x="960" y="1236" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Subscribe</text>
  </g>
</svg>